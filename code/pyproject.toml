[project]
name = "io-case"
version = "0.1.0"
description = "QR ticket issuance service (interview case)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "pydantic>=2.0",
    "uvicorn[standard]>=0.32",  # [standard] includes python-dotenv, needed for --env-file
    "sqlalchemy>=2.0",
    "pyjwt[crypto]>=2.10",
    "cryptography>=42",  # imported directly for key loading
    "tzdata",  # Europe/Amsterdam on Windows, which has no system time zone database
]

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.2"]
dev = ["pytest>=8.0", "httpx>=0.27"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
